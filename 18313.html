<style>
/* ═══ ОБЩИЙ СТИЛЬ: палитра, типографика, компоненты. Не менять. ═══ */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --inset:#f0f0f3; --seg-on:#ffffff;
  --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#a1a1a6; --hair:rgba(0,0,0,.08);
  --green:#199A42; --green-hi:#3ccb6b; --green-lo:#0e7a30; --green-text:#0f7a32; --green-fill:#199A42;
  --orange:#FF862F; --orange-ink:#c2560c; --blue:#0071e3;
  --violet:#7b4fd6; --violet-hi:#b196f5; --violet-lo:#5631b3; --violet-ink:#6336c9;
  --stage-a:#fdfdfe; --stage-b:#e9e9ee;
  --slab-a:#f4f4f7; --slab-b:#c6c6cf; --slab-edge:rgba(0,0,0,.16);
  --thumb:#ffffff; --cv-shadow:rgba(0,0,0,.2);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 32px rgba(0,0,0,.06);
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --inset:#2c2c2e; --seg-on:#636366;
  --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#6e6e73; --hair:rgba(255,255,255,.1);
  --green:#2fbf5b; --green-hi:#63dd88; --green-lo:#15803a; --green-text:#4fd47c; --green-fill:#199A42;
  --orange:#ff9340; --orange-ink:#ffa35c; --blue:#2997ff;
  --violet:#a78bfa; --violet-hi:#d3c5ff; --violet-lo:#7453d8; --violet-ink:#c2adff;
  --stage-a:#242427; --stage-b:#101012;
  --slab-a:#74747a; --slab-b:#3f3f44; --slab-edge:rgba(255,255,255,.18);
  --thumb:#f2f2f7; --cv-shadow:rgba(0,0,0,.55);
  --shadow:0 0 0 1px rgba(255,255,255,.06);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --inset:#2c2c2e; --seg-on:#636366;
  --ink:#f5f5f7; --ink-2:#a1a1a6; --ink-3:#6e6e73; --hair:rgba(255,255,255,.1);
  --green:#2fbf5b; --green-hi:#63dd88; --green-lo:#15803a; --green-text:#4fd47c; --green-fill:#199A42;
  --orange:#ff9340; --orange-ink:#ffa35c; --blue:#2997ff;
  --violet:#a78bfa; --violet-hi:#d3c5ff; --violet-lo:#7453d8; --violet-ink:#c2adff;
  --stage-a:#242427; --stage-b:#101012;
  --slab-a:#74747a; --slab-b:#3f3f44; --slab-edge:rgba(255,255,255,.18);
  --thumb:#f2f2f7; --cv-shadow:rgba(0,0,0,.55);
  --shadow:0 0 0 1px rgba(255,255,255,.06);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;padding-inline:20px;padding-block:18px 48px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 60%,transparent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* шапка: логотип слева, ссылка на телеграм справа */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:0}
.logo svg{display:block;height:34px;width:auto;color:var(--ink)}
.tg{display:inline-flex;align-items:center;padding:8px 14px 8px 8px;border-radius:999px;background:var(--surface);
  box-shadow:var(--shadow);color:var(--ink);text-decoration:none;transition:transform .2s ease}
.tg svg{display:block;height:26px;width:auto}
.tg:hover{transform:translateY(-1px)}

.card{background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:22px;min-width:0}
h2{margin:0;font-size:21px;line-height:1.2;font-weight:600;letter-spacing:-.012em}

/* сцена: холст, поверх него подписи (HTML), часы */
.stage-card{padding:10px}
.stage{position:relative;min-width:0;border-radius:20px;overflow:hidden;background:linear-gradient(var(--stage-a),var(--stage-b))}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;left:0;top:0;white-space:nowrap;font-size:16px;line-height:1.25;display:flex;align-items:baseline;gap:.32em;will-change:transform}
.lab .val{font-family:var(--num);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.lab.chip{padding:3px 10px 4px;border-radius:999px;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.08)}
.lab.dim{color:var(--ink)}              /* размеры и время */
.lab.b1{color:var(--green-text)}        /* первое тело */
.lab.b2{color:var(--violet-ink)}        /* второе тело */
.lab.bu{color:var(--ink)}               /* общее, итог */
.lab.f{color:var(--orange-ink)}         /* силы */
.lab.a{color:var(--blue)}               /* ускорения */
.clock{position:absolute;right:18px;top:10px;font-family:var(--num);font-variant-numeric:tabular-nums;
  font-size:clamp(34px,4.4vw,46px);font-weight:600;letter-spacing:-.02em;line-height:1.1}
.clock small{font-size:.42em;font-weight:500;color:var(--ink-2);margin-left:.22em;letter-spacing:0}

/* шкала времени под сценой: риски и подписи главных моментов */
.tl{position:relative;padding:8px 10px 26px;--tint:var(--ink)}
.tl input{position:relative;display:block}
.tlm{position:absolute;left:10px;right:10px;top:8px;height:30px;pointer-events:none}
.tm{position:absolute;top:0;left:calc(12px + var(--x) * (100% - 24px))}
.tm i{position:absolute;left:-1px;top:21px;width:2px;height:6px;border-radius:1px;background:var(--ink-3)}
.tm b{position:absolute;top:30px;left:0;transform:translateX(-50%);white-space:nowrap;padding:2px 6px;border-radius:8px;
  font-size:12px;line-height:1.3;font-weight:600;color:var(--ink-2);pointer-events:auto;cursor:pointer}
.tm b:hover{background:var(--inset);color:var(--ink)}
.tm b:empty{display:none}
.tm.key i{left:-1.5px;width:3px;height:7px;border-radius:1.5px;background:var(--orange)}
.tm.key b{color:var(--ink)}
.tm.start b{transform:none;left:-14px}
.tm.left b{transform:translateX(-100%);left:14px}
.tm.end b{transform:translateX(-100%);left:18px}

/* кнопки под сценой */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 8px 6px;min-width:0}
.bar .sp{flex:1 1 0}
.btn{appearance:none;border:0;font:inherit;font-size:15px;font-weight:600;height:44px;padding:0 18px 0 14px;border-radius:999px;
  background:var(--inset);color:var(--ink);display:inline-flex;align-items:center;gap:7px;cursor:pointer;
  transition:transform .15s ease,opacity .2s}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--green-fill);color:#ffffff;min-width:132px}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{height:38px;font-size:14px;padding:0 14px;gap:8px}
.btn.tog::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;border:2px solid currentColor;opacity:.6}
.btn.tog[aria-pressed="true"]{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--green-text)}
.btn.tog[aria-pressed="true"]::before{background:currentColor;opacity:1}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--inset)}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--ink-2);
  height:38px;padding:0 14px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s,color .2s;font-variant-numeric:tabular-nums}
.seg button[aria-checked="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14),0 0 0 .5px rgba(0,0,0,.05)}

/* параметр: подпись, числовое поле, под ними слайдер */
.prm{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:2px 12px;padding:11px 0 7px;min-width:0}
.prm label{font-size:15px;color:var(--ink-2);display:flex;align-items:baseline;gap:.4em;min-width:0}
.prm label .tex{color:var(--ink)}
.prm output{font-family:var(--num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.prm input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent;cursor:pointer;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--tint,var(--ink)) var(--p),var(--inset) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--inset)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--tint,var(--ink))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;
  background:var(--thumb);box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 3px 8px rgba(0,0,0,.2)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;
  background:var(--thumb);box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 3px 8px rgba(0,0,0,.2)}
.nf{display:inline-flex;align-items:baseline;gap:5px;height:36px;line-height:36px;padding:0 10px;border-radius:11px;background:var(--inset);
  cursor:text;transition:box-shadow .15s}
.nf:focus-within{box-shadow:0 0 0 2px color-mix(in srgb,var(--blue) 70%,transparent)}
.nf input{appearance:none;border:0;margin:0;padding:0;background:transparent;color:var(--ink);font-family:var(--num);font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;line-height:36px;height:36px;width:4ch;min-width:0;text-align:right;outline:0}
.nf input:disabled{opacity:.45}
.nf .u{font-size:14px;color:var(--ink-2)}

/* формулы: группа = цветная точка, заголовок капителью, 1–3 строки */
.fh{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-2)}
.fh i{flex:none;width:9px;height:9px;border-radius:3px}
.fl{font-size:17px;min-height:30px;padding:4px 0;color:var(--ink-2);overflow-x:auto;overflow-y:hidden}
.fl.res{color:var(--ink)}
.fg.off,.fl.off{opacity:.45}
.fnote{margin:4px 0 0;font-size:14px;line-height:1.4;color:var(--ink-2)}
mjx-container{margin:0!important;line-height:inherit}
.tex{display:inline-block;line-height:inherit}
.fl.tex{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ═══ РАСКЛАДКА «ДЛЯ ВЕБА»: шапка → заголовок → две колонки (сцена и формулы | параметры); до 980px — одна колонка ═══ */
.page{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.hero{display:flex;flex-direction:column;gap:10px;padding-block:6px 2px}
.eyebrow{margin:0;font-size:13px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--green-text)}
h1{margin:0;font-size:clamp(34px,5.4vw,58px);line-height:1.04;letter-spacing:-.028em;font-weight:700;text-wrap:balance}
.lede{margin:0;font-size:clamp(17px,1.7vw,21px);line-height:1.38;color:var(--ink-2);max-width:40em}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 364px;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
/* сцена с часами, шкалой времени и кнопками целиком помещается в первый экран */
.stage{height:clamp(380px,min(40vw,100vh - 440px),540px)}
.pill{position:absolute;left:14px;top:14px;max-width:calc(100% - 150px);display:flex;align-items:center;gap:8px;
  padding:8px 13px 8px 11px;border-radius:999px;font-size:14px;font-weight:500;line-height:1.2;
  background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.07)}
.pill i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--ink-3);transition:background .25s}
.pill[data-s="slip"] i{background:var(--orange)}
.pill[data-s="stick"] i{background:var(--green)}
.prm + .prm{border-top:1px solid var(--hair)}
.prm:first-of-type{padding-top:14px}
.bal{margin-top:6px;padding-top:14px;border-top:1px solid var(--hair);font-size:14px;line-height:1.35;color:var(--ink-2);min-height:calc(14px + 2.7em)}
.acts{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px}
.fg{padding:14px 0 10px}
.fg + .fg{border-top:1px solid var(--hair)}
.fg:last-child{padding-bottom:0}
@media (min-width:981px){
  /* формулы под сценой — группами в две колонки; .fg.wide занимает всю ширину, а её строки встают рядом */
  .fcard{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;align-items:start}
  .fcard > h2{grid-column:1/-1}
  .card.fcard .fg{border-top:0;padding:14px 0 12px}
  .card.fcard .fg:nth-child(n+4){border-top:1px solid var(--hair)}
  .card.fcard .fg:nth-last-child(-n+2){padding-bottom:0}
  .card.fcard .fg.wide{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;align-items:center}
  .card.fcard .fg.wide .fh{grid-column:1/-1}
}
@media (max-width:980px){
  /* одна колонка: сцена, параметры, формулы */
  .grid{display:flex;flex-direction:column;align-items:stretch}
  .grid > .col{display:contents}
  .stage-card{order:1}
  .grid > aside > .card{order:2}
  .fcard{order:3}
}
@media (max-width:560px){
  body{padding-inline:16px}
  .logo svg{height:28px}
  .tg svg{height:22px}
  .card{padding:18px;border-radius:24px}
  .stage-card{padding:8px}
  .stage{border-radius:17px;height:500px}
  .bar{padding:10px 4px 4px}
  .bar .sp{display:none}
  .btn{flex:1 1 0;justify-content:center}
  .seg{flex:1 1 100%}
  .seg button{flex:1 1 0;padding:0 6px}
  .pill{font-size:13px;left:10px;top:10px}
  .clock{right:12px;top:8px}
  .lab{font-size:14px}
  .lab .val{font-size:13px}
}
.calc-controls{display:grid;gap:10px;margin:18px 0}.calc-controls label{color:var(--ink-2);font-size:14px}.calc-controls select{width:100%;min-width:0;padding:12px;border-radius:12px;border:1px solid var(--hair);background:var(--stage-a);color:var(--ink);font:inherit;font-size:14px}.calc-controls option{background:var(--surface);color:var(--ink)}#calcError{color:var(--orange);font-size:14px;margin:0}.calc-result{grid-column:1/-1}.prm:has(input:disabled){opacity:.65}
</style>
